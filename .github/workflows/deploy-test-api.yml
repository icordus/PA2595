name: Deploy and Test API

on:
  workflow_dispatch:

jobs:
  deploy-and-test:
    runs-on: [self-hosted, linux, ARM64]

    env:
      APP_NAME: student-risk-api
      IMAGE_NAME: student-risk-api
      IMAGE_TAG: "0.1.10"
      NODE_IP: "192.168.0.71"
      NODE_PORT: "30080"
      BASE_URL: "http://192.168.0.71"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # Install the Python version used by this project.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Build Docker image
        run: |
          docker build -f Dockerfile -t ${IMAGE_NAME}:${IMAGE_TAG} .

      - name: Load into containerd
        run: |
          docker save ${IMAGE_NAME}:${IMAGE_TAG} -o img.tar
          sudo ctr -n k8s.io images import img.tar

      - name: Deploy with Helm
        run: |
          helm upgrade --install ${APP_NAME} ./helm/student-risk-api \
            --set image.repository=${IMAGE_NAME} \
            --set image.tag=${IMAGE_TAG} \
            --set image.pullPolicy=Never \
            --set service.type=NodePort \
            --set service.nodePort=${NODE_PORT}

      - name: Check deployment
        run: |
          kubectl get deployments -n student-risk-api

      - name: Smoke test /health
        run: |
          curl -f ${BASE_URL}:${NODE_PORT}/health

      - name: API regression tests
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          export BASE_URL=${BASE_URL}:${NODE_PORT} 
          python3 -m pytest tests/api -v

      - name: Test selection (--lf)
        run: |
          source venv/bin/activate
          export BASE_URL=${BASE_URL}:${NODE_PORT} 
          python -m pytest tests/api -v --lf