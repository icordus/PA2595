name: Deploy and Test API

on:
  workflow_dispatch:

jobs:
  deploy-and-test:
    runs-on: [self-hosted, linux, ARM64]

    env:
      APP_NAME: student-risk-api
      IMAGE_NAME: student-risk-api
      IMAGE_TAG: "0.1.10"
      NODE_IP: "192.168.0.71"
      NODE_PORT: "30080"
      BASE_URL: "http://192.168.0.71:30080"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # Install the Python version used by this project.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      # Create an isolated virtual environment for CI commands.
      - name: Create virtual environment
        run: |
          # Create a clean Python virtual environment.
          python -m venv venv

      # Install all Python dependencies required by the project.
      - name: Install dependencies
        run: |
          # Activate venv and install dependencies from requirements.txt.
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-package.txt

      - name: Build Docker image
        run: |
          docker build -f Dockerfile -t ${IMAGE_NAME}:${IMAGE_TAG} .

      - name: Load into containerd
        run: |
          docker save ${IMAGE_NAME}:${IMAGE_TAG} -o img.tar
          sudo ctr -n k8s.io images import img.tar

      - name: Deploy with Helm
        run: |
          helm upgrade --install ${APP_NAME} ./helm/student-risk-api \
            --set image.repository=${IMAGE_NAME} \
            --set image.tag=${IMAGE_TAG} \
            --set image.pullPolicy=Never \
            --set service.type=NodePort \
            --set service.nodePort=${NODE_PORT}

      - name: Rollout status
        run: |
          kubectl get deployments

      - name: Smoke test /health
        run: |
          curl -f ${BASE_URL}/health

      - name: API regression tests
        run: |
          BASE_URL=${BASE_URL} python3 -m pytest tests/api -v

      - name: Test selection (--lf)
        run: |
          BASE_URL=${BASE_URL} python -m pytest tests/api -v --lf
