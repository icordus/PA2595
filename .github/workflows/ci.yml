name: Student Performance ML Pipeline (Manual Run)

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Create virtual environment
        run: |
          python -m venv venv

      - name: Install dependencies
        run: |
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download dataset for CI
        run: |
          set -e
          mkdir -p data/raw
          if [ ! -f data/raw/student-mat.csv ]; then
            curl -L "https://archive.ics.uci.edu/static/public/320/student+performance.zip" -o /tmp/student-performance.zip

            unzip -o /tmp/student-performance.zip -d /tmp/student-data

            cp /tmp/student-data/student/student-mat.csv data/raw/
          fi
          ls -R data/raw
      - name: Run pipeline
        run: |
          source venv/bin/activate
          python src/preprocess.py
          python src/train.py
          python src/evaluate.py

      - name: Run tests
        run: |
          source venv/bin/activate
          python -m unittest discover -s tests -p "test_*.py"